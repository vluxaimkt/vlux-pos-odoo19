name: CI

on:
  push:
    branches: ["main", "release/**", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  ODOO_COMMIT: a2d73c5900d8886d115afe1ccb7f5c97c7e71a97
  ODOO_DIR: ${{ github.workspace }}/odoo
  ADDONS_DIR: ${{ github.workspace }}/vlux-addons
  TEST_DB: vlux_ci
  VLUX_ADDONS: vlux_core,vlux_mobile_scanner,vlux_owner,vlux_facturacion

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout VLUX addons
        uses: actions/checkout@v4
        with:
          path: vlux-addons

      - name: Checkout Odoo Community 19.0 baseline
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: ${{ env.ODOO_COMMIT }}
          path: odoo
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            odoo/requirements.txt
            vlux-addons/requirements-extra.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            libevent-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libldap2-dev \
            libpq-dev \
            libsasl2-dev \
            libssl-dev \
            libxml2-dev \
            libxslt1-dev \
            node-less \
            npm \
            pkg-config \
            postgresql-client-16 \
            python3-dev \
            zlib1g-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "$ODOO_DIR/requirements.txt"
          python -m pip install -r "$ADDONS_DIR/requirements-extra.txt"
          python -m pip check

      - name: Verify fixed Odoo baseline
        working-directory: ${{ env.ODOO_DIR }}
        run: |
          test "$(git rev-parse HEAD)" = "$ODOO_COMMIT"

      - name: Lightweight static checks
        working-directory: ${{ env.ADDONS_DIR }}
        run: |
          python scripts/release/static_checks.py
          python scripts/release/public_repo_scan.py

      - name: Create test database
        env:
          PGPASSWORD: odoo
        run: |
          createdb -h 127.0.0.1 -U odoo "$TEST_DB"

      - name: Install VLUX addons
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          python "$ODOO_DIR/odoo-bin" \
            --addons-path "$ODOO_DIR/addons,$ODOO_DIR/odoo/addons,$ADDONS_DIR" \
            -d "$TEST_DB" \
            -i "$VLUX_ADDONS" \
            --without-demo=all \
            --stop-after-init \
            --log-level=test

      - name: Run VLUX addon tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          python "$ODOO_DIR/odoo-bin" \
            --addons-path "$ODOO_DIR/addons,$ODOO_DIR/odoo/addons,$ADDONS_DIR" \
            -d "$TEST_DB" \
            -u "$VLUX_ADDONS" \
            --test-enable \
            --test-tags /vlux_core,/vlux_mobile_scanner,/vlux_owner,/vlux_facturacion \
            --stop-after-init \
            --log-level=test

      - name: Build VLUX distribution metadata
        working-directory: ${{ env.ADDONS_DIR }}
        run: |
          python scripts/release/build_release.py ci-smoke --edition local_complete
          python scripts/release/build_distribution.py ci-smoke --out-dir dist
