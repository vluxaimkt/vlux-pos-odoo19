name: CI

on:
  push:
    branches: ["main", "release/**", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Nightly: full suite, browser tours and the performance budgets.
    - cron: "0 7 * * *"

env:
  ODOO_COMMIT: a2d73c5900d8886d115afe1ccb7f5c97c7e71a97
  ODOO_DIR: ${{ github.workspace }}/odoo
  ADDONS_DIR: ${{ github.workspace }}/vlux-addons
  TEST_DB: vlux_ci
  VLUX_ADDONS: vlux_core,vlux_mobile_scanner,vlux_owner,vlux_pos_catalog,vlux_facturacion

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout VLUX addons
        uses: actions/checkout@v5
        with:
          path: vlux-addons

      - name: Checkout Odoo Community 19.0 baseline
        uses: actions/checkout@v5
        with:
          repository: odoo/odoo
          ref: ${{ env.ODOO_COMMIT }}
          path: odoo
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            odoo/requirements.txt
            vlux-addons/requirements-extra.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            libevent-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libldap2-dev \
            libpq-dev \
            libsasl2-dev \
            libssl-dev \
            libxml2-dev \
            libxslt1-dev \
            node-less \
            npm \
            pkg-config \
            postgresql-client-16 \
            python3-dev \
            zlib1g-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "$ODOO_DIR/requirements.txt"
          python -m pip install -r "$ADDONS_DIR/requirements-extra.txt"
          python -m pip check

      - name: Verify fixed Odoo baseline
        working-directory: ${{ env.ODOO_DIR }}
        run: |
          test "$(git rev-parse HEAD)" = "$ODOO_COMMIT"

      - name: Lightweight static checks
        working-directory: ${{ env.ADDONS_DIR }}
        run: |
          python scripts/release/static_checks.py
          python scripts/release/public_repo_scan.py
          python scripts/release/test_build_release.py

      - name: Mobile scanner client unit tests
        working-directory: ${{ env.ADDONS_DIR }}
        run: |
          node --test vlux_mobile_scanner/static/tests/node/scanner_core.test.js

      - name: Create test database
        env:
          PGPASSWORD: odoo
        run: |
          createdb -h 127.0.0.1 -U odoo "$TEST_DB"

      - name: Install VLUX addons
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          python "$ODOO_DIR/odoo-bin" \
            --addons-path "$ODOO_DIR/addons,$ODOO_DIR/odoo/addons,$ADDONS_DIR" \
            -d "$TEST_DB" \
            -i "$VLUX_ADDONS" \
            --without-demo=all \
            --stop-after-init \
            --log-level=test

      - name: Run VLUX addon tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          python "$ODOO_DIR/odoo-bin" \
            --addons-path "$ODOO_DIR/addons,$ODOO_DIR/odoo/addons,$ADDONS_DIR" \
            -d "$TEST_DB" \
            -u "$VLUX_ADDONS" \
            --test-enable \
            --test-tags /vlux_core,/vlux_mobile_scanner,/vlux_owner,/vlux_pos_catalog,/vlux_facturacion,-vlux_e2e \
            --stop-after-init \
            --log-level=test

      - name: Build VLUX distribution metadata
        working-directory: ${{ env.ADDONS_DIR }}
        run: |
          python scripts/release/build_release.py ci-smoke --edition local_complete --odoo-home "$ODOO_DIR"
          python scripts/release/build_distribution.py ci-smoke --out-dir dist --odoo-home "$ODOO_DIR"

  e2e:
    # Browser tours (tag vlux_e2e): POS catalog quick creation and the mobile
    # scanner protocol end to end. Odoo enables websockets during tours, so the
    # bus push is exercised for real. ubuntu-24.04 runners ship Google Chrome.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout VLUX addons
        uses: actions/checkout@v5
        with:
          path: vlux-addons

      - name: Checkout Odoo Community 19.0 baseline
        uses: actions/checkout@v5
        with:
          repository: odoo/odoo
          ref: ${{ env.ODOO_COMMIT }}
          path: odoo
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            odoo/requirements.txt
            vlux-addons/requirements-extra.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            libevent-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libldap2-dev \
            libpq-dev \
            libsasl2-dev \
            libssl-dev \
            libxml2-dev \
            libxslt1-dev \
            node-less \
            npm \
            pkg-config \
            postgresql-client-16 \
            python3-dev \
            zlib1g-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "$ODOO_DIR/requirements.txt"
          python -m pip install -r "$ADDONS_DIR/requirements-extra.txt"
          python -m pip check

      - name: Verify fixed Odoo baseline
        working-directory: ${{ env.ODOO_DIR }}
        run: |
          test "$(git rev-parse HEAD)" = "$ODOO_COMMIT"

      - name: Install test-only dependencies
        run: |
          python -m pip install -r "$ADDONS_DIR/requirements-test.txt"
          google-chrome --version

      - name: Create test database
        env:
          PGPASSWORD: odoo
        run: |
          createdb -h 127.0.0.1 -U odoo "$TEST_DB"

      - name: Install VLUX addons
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          python "$ODOO_DIR/odoo-bin" \
            --addons-path "$ODOO_DIR/addons,$ODOO_DIR/odoo/addons,$ADDONS_DIR" \
            -d "$TEST_DB" \
            -i "$VLUX_ADDONS" \
            --without-demo=all \
            --stop-after-init \
            --log-level=test

      - name: Run browser tours
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          set -o pipefail
          python "$ODOO_DIR/odoo-bin" \
            --addons-path "$ODOO_DIR/addons,$ODOO_DIR/odoo/addons,$ADDONS_DIR" \
            -d "$TEST_DB" \
            --test-enable \
            --test-tags vlux_e2e \
            --stop-after-init \
            --log-level=test 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          grep -E "0 failed, 0 error\(s\) of [1-9][0-9]* tests" "$RUNNER_TEMP/e2e.log"

      - name: Keep the tour log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-log
          path: ${{ runner.temp }}/e2e.log
          retention-days: 7

  performance:
    # Nightly / on demand only: seeds a small synthetic dataset and checks
    # generous absolute budgets. Relative BEFORE/AFTER comparisons are done
    # locally with tools/perf/compare.py when validating a change.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PERF_DB: vlux_perf_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout VLUX addons
        uses: actions/checkout@v5
        with:
          path: vlux-addons

      - name: Checkout Odoo Community 19.0 baseline
        uses: actions/checkout@v5
        with:
          repository: odoo/odoo
          ref: ${{ env.ODOO_COMMIT }}
          path: odoo
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            odoo/requirements.txt
            vlux-addons/requirements-extra.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            libevent-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libldap2-dev \
            libpq-dev \
            libsasl2-dev \
            libssl-dev \
            libxml2-dev \
            libxslt1-dev \
            node-less \
            npm \
            pkg-config \
            postgresql-client-16 \
            python3-dev \
            zlib1g-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "$ODOO_DIR/requirements.txt"
          python -m pip install -r "$ADDONS_DIR/requirements-extra.txt"
          python -m pip check

      - name: Verify fixed Odoo baseline
        working-directory: ${{ env.ODOO_DIR }}
        run: |
          test "$(git rev-parse HEAD)" = "$ODOO_COMMIT"

      - name: Create test database
        env:
          PGPASSWORD: odoo
        run: |
          createdb -h 127.0.0.1 -U odoo "$PERF_DB"

      - name: Install VLUX addons
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          python "$ODOO_DIR/odoo-bin" \
            --addons-path "$ODOO_DIR/addons,$ODOO_DIR/odoo/addons,$ADDONS_DIR" \
            -d "$PERF_DB" \
            -i "$VLUX_ADDONS" \
            --without-demo=all \
            --stop-after-init \
            --log-level=test

      - name: Seed synthetic data (1k products / 1k orders)
        working-directory: ${{ env.ADDONS_DIR }}
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          python tools/perf/seed_synthetic.py --odoo-home "$ODOO_DIR" \
            --addons-path "$ODOO_DIR/addons,$ODOO_DIR/odoo/addons,$ADDONS_DIR" \
            -d "$PERF_DB" --products 1000 --orders 1000

      - name: Benchmarks and budgets
        working-directory: ${{ env.ADDONS_DIR }}
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          COMMON="--odoo-home $ODOO_DIR --addons-path $ODOO_DIR/addons,$ODOO_DIR/odoo/addons,$ADDONS_DIR -d $PERF_DB"
          mkdir -p perf
          python tools/perf/bench_owner.py $COMMON --iterations 10 --json perf/owner.json
          python tools/perf/bench_pos_load.py $COMMON --iterations 3 --json perf/pos_load.json
          python tools/perf/bench_pos_load.py $COMMON --iterations 3 --incremental --json perf/pos_load_incremental.json
          python tools/perf/compare.py perf/owner.json perf/owner.json \
            --budget 'latency_ms.p95:<=:abs:1500' \
            --budget 'sql_queries_per_call.max:<=:abs:25'
          python tools/perf/compare.py perf/pos_load.json perf/pos_load.json \
            --budget 'load_data_ms.p95:<=:abs:8000' \
            --budget 'payload_bytes:<=:abs:3000000'
          python tools/perf/compare.py perf/pos_load_incremental.json perf/pos_load_incremental.json \
            --budget 'load_data_ms.p95:<=:abs:1500'

      - name: Keep benchmark reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-reports
          path: ${{ env.ADDONS_DIR }}/perf
          retention-days: 30
