services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./tenants/${VLUX_TENANT}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    image: vlux-pos:${VLUX_VERSION}
    restart: unless-stopped
    environment:
      VLUX_POS_ROOT: /opt/vlux/pos
      VLUX_POS_CONFIG: /etc/vlux-pos
      VLUX_POS_DATA: /var/lib/vlux-pos
      VLUX_POS_LOGS: /var/log/vlux-pos
    volumes:
      - ./tenants/${VLUX_TENANT}/config:/etc/vlux-pos
      - ./tenants/${VLUX_TENANT}/filestore:/var/lib/vlux-pos/filestore
      - ./tenants/${VLUX_TENANT}/logs:/var/log/vlux-pos
    depends_on:
      - postgres
    expose:
      - "8069"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VLUX_DB_NAME}
      POSTGRES_USER: ${VLUX_DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - ./tenants/${VLUX_TENANT}/postgres:/var/lib/postgresql/data
    secrets:
      - db_password
    expose:
      - "5432"

secrets:
  db_password:
    file: ./tenants/${VLUX_TENANT}/secrets/db_password

volumes:
  caddy_data:
  caddy_config:
