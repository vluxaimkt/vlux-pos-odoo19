# VLUX EDGE - the single public entry point of a VLUX POS cloud host.
#
# Exactly one edge stack runs per host. It is the only component bound to the
# public 80/443 ports; tenant stacks never publish a port. Tenant routes are
# dropped into ${VLUX_EDGE_ROOT}/tenants/<tenant>.caddy and picked up by an
# atomic `caddy reload`, so adding a tenant never restarts the other tenants.

name: vlux-edge

services:
  caddy:
    image: ${VLUX_CADDY_IMAGE:-caddy:2.10@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb}
    container_name: vlux-edge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      VLUX_ACME_EMAIL: ${VLUX_ACME_EMAIL:-}
    volumes:
      - ${VLUX_EDGE_ROOT:-/srv/vlux-pos/edge}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${VLUX_EDGE_ROOT:-/srv/vlux-pos/edge}/tenants:/etc/caddy/tenants:ro
      - ${VLUX_EDGE_ROOT:-/srv/vlux-pos/edge}/data:/data
      - ${VLUX_EDGE_ROOT:-/srv/vlux-pos/edge}/config:/config
      - ${VLUX_EDGE_ROOT:-/srv/vlux-pos/edge}/logs:/var/log/caddy
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/vlux/edge/health | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # Shared only between the edge and the tenant app containers. Tenant
  # PostgreSQL containers are never attached to it.
  edge:
    name: vlux-edge
    external: true
